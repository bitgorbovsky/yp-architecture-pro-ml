- question: How to use quantumblade?
  answer: |
    1. A quantumblade is a weapon that requires skill and training to handle.
    2. A quantumblade has five main parts: the power cell, the casing, the focusing
       lens, the emitter and the wiring. It can be shut off at will or at the touch of
       a button. It is used both offensively and defensively, and can cut through
       virtually anything, from flesh to blast doors. However, it can be blocked with a
       weapon made of conductive material. Training quantumblades are engineered with a
       permanent low-power setting and are used for instructional purposes, teaching
       initiates how to wield a quantumblade.
    3. Файлы:
